<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexxus - Onboarding</title>
    
    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for Nexxus Dark Onboarding -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#a855f7',
                            500: '#8b5cf6', 
                            600: '#7c3aed',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; /* Prevent scrolling on splash screen */
            overscroll-behavior-y: none;
        }

        /* Glassmorphism for buttons */
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .glass-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.1);
        }

        .primary-btn:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }

        .hide-initially { opacity: 0; }
        .stagger-1 { animation-delay: 200ms; }
        .stagger-2 { animation-delay: 400ms; }
        .stagger-3 { animation-delay: 600ms; }
        .stagger-4 { animation-delay: 800ms; }
    </style>
</head>
<body class="flex flex-col h-screen w-full sm:w-[414px] sm:mx-auto sm:border-x sm:border-gray-800 sm:shadow-2xl relative font-sans">

    <!-- Background Image -->
    <img src="img/fondoNexxus.jpg" alt="Fondo Nexxus" class="absolute inset-0 w-full h-full object-cover z-0" />

    <!-- Optional dark gradient overlay so text remains readable -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 z-10 pointer-events-none"></div>

    <!-- Header Logo -->
    <header class="px-8 py-8 relative z-20 hide-initially animate-fade-in-up stagger-1">
        <div class="flex items-center gap-1.5">
            <span class="text-xl font-bold tracking-tight text-white">Nexxus<span class="text-brand-400">.</span></span>
        </div>
    </header>

    <!-- Main Content Bottom Area -->
    <main class="flex-1 flex flex-col justify-end px-8 pb-12 relative z-20">
        
        <div class="mb-10">
            <h1 class="text-[44px] leading-[1.05] font-bold text-white tracking-tight mb-4 hide-initially animate-fade-in-up stagger-2">
                Eleva tu<br>Empresa
            </h1>
            <p class="text-[15px] text-gray-300 font-medium leading-relaxed max-w-[260px] hide-initially animate-fade-in-up stagger-3">
                El sistema operativo inteligente que transforma la gestión de talento en El Salvador.
            </p>
        </div>

        <!-- Action Buttons Bottom Row -->
        <div class="flex items-center gap-4 hide-initially animate-fade-in-up stagger-4">
            
            <!-- Main Action -->
            <button class="flex-1 py-4 bg-white text-black rounded-full text-base font-bold primary-btn flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                Comenzar <i data-lucide="arrow-up-right" class="w-5 h-5 ml-1"></i>
            </button>
            
            <!-- Glass Theme Toggle -->
            <button class="w-14 h-14 shrink-0 rounded-full glass-btn flex items-center justify-center text-white" onclick="toggleTheme(this)">
                <i data-lucide="sun" class="w-6 h-6"></i>
            </button>
            
            <!-- Glass Support Toggle -->
            <button class="w-14 h-14 shrink-0 rounded-full glass-btn flex items-center justify-center text-white relative">
                <i data-lucide="life-buoy" class="w-6 h-6"></i>
            </button>
            
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Simple script to toggle the icon for the theme button
        function toggleTheme(btn) {
            const icon = btn.querySelector('i');
            const currentIcon = icon.getAttribute('data-lucide');
            
            if (currentIcon === 'sun') {
                icon.setAttribute('data-lucide', 'moon');
            } else {
                icon.setAttribute('data-lucide', 'sun');
            }
            
            // Re-render that specific icon
            lucide.createIcons();
        }
    </script>
</body>
</html>

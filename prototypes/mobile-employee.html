<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexxus - App Empleado</title>
    
    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for Nexxus Dark -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#a855f7',
                            500: '#8b5cf6', 
                            600: '#7c3aed',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(239, 68, 68, 0.3)' },
                            '50%': { boxShadow: '0 0 30px rgba(239, 68, 68, 0.6)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        /* Glassmorphism panels */
        .glass-dark {
            background: rgba(22, 16, 34, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .glass-nav-pill {
            background: rgba(20, 15, 30, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .active-press:active {
            transform: scale(0.96);
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hide-initially { opacity: 0; }
        .stagger-1 { animation-delay: 100ms; }
        .stagger-2 { animation-delay: 200ms; }
        .stagger-3 { animation-delay: 300ms; }
        .stagger-4 { animation-delay: 400ms; }

        ::-webkit-scrollbar {
            display: none;
        }
        
        .pull-indicator {
            width: 40px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 0 auto;
        }

        /* Custom pulsing button for check-out (active state) */
        .btn-pulse-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-full sm:w-[414px] sm:mx-auto sm:border-x sm:border-gray-800 sm:shadow-2xl relative font-sans">

    <!-- Background Image -->
    <img src="img/fondoNexxus.jpg" alt="Fondo Nexxus" class="absolute inset-0 w-full h-full object-cover z-0" />

    <!-- Dark gradient overlay so the UI stays readable -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-black/50 to-black/90 z-10 pointer-events-none"></div>

    <!-- Header -->
    <header class="px-6 py-5 flex items-center justify-between hide-initially animate-fade-in-up stagger-1 relative z-20">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full glass-card flex items-center justify-center overflow-hidden active-press">
                <!-- Avatar placeholder -->
                <img src="https://ui-avatars.com/api/?name=Carlos+Empleado&background=161022&color=fff" alt="User" class="w-full h-full object-cover">
            </div>
            <div>
                <p class="text-[11px] text-gray-300 font-medium">Desarrollo de Software</p>
                <h1 class="text-lg font-bold text-white tracking-tight">Hola, Carlos</h1>
            </div>
        </div>
        
        <button class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-white active-press transition-colors relative">
            <i data-lucide="bell" class="w-4 h-4"></i>
            <span class="absolute top-2 right-2 w-2 h-2 bg-brand-400 rounded-full shadow-[0_0_8px_#a855f7]"></span>
        </button>
    </header>

    <!-- Main Content Top Area -->
    <main class="flex-none px-6 pt-2 pb-6 relative z-20">
        
        <!-- Live Time Tracking Card (Marcaje) -->
        <div class="w-full rounded-[28px] glass-card p-6 flex flex-col justify-between hide-initially animate-fade-in-up stagger-2 active-press relative overflow-hidden mb-5">
            <!-- Glass highlight -->
            <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/10 to-transparent"></div>
            
            <div class="flex justify-between items-start relative z-10">
                <span class="text-sm font-bold text-white/90 flex items-center gap-2">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full shadow-[0_0_8px_#34d399]"></div>
                    En turno
                </span>
                <span class="text-xs font-mono text-gray-300 bg-black/30 px-2.5 py-1 rounded-full backdrop-blur-md border border-white/10">09:00 AM - 05:00 PM</span>
            </div>
            
            <div class="relative z-10 mt-6 flex items-center justify-between">
                <div>
                    <h3 class="text-4xl font-bold text-white tracking-tight font-mono">04:32<span class="text-lg text-white/50">h</span></h3>
                    <p class="text-[11px] text-gray-300 font-medium mt-1">Tiempo registrado hoy</p>
                </div>
                
                <button class="w-14 h-14 rounded-full bg-red-500/20 border border-red-500/50 flex items-center justify-center text-red-400 btn-pulse-red active-press transition-colors">
                    <i data-lucide="square" class="w-5 h-5 fill-current"></i>
                </button>
            </div>
        </div>

        <!-- Quick Actions Grid -->
        <div class="grid grid-cols-4 gap-3 hide-initially animate-fade-in-up stagger-3">
            
            <!-- Action 1 -->
            <div class="flex flex-col items-center gap-2 group active-press">
                <div class="w-14 h-14 rounded-2xl glass-card flex items-center justify-center text-white transition-all group-active:scale-95 group-hover:bg-white/10">
                    <i data-lucide="calendar-clock" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium text-gray-300 text-center">Permisos</span>
            </div>
            
            <!-- Action 2 -->
            <div class="flex flex-col items-center gap-2 group active-press">
                <div class="w-14 h-14 rounded-2xl glass-card flex items-center justify-center text-white transition-all group-active:scale-95 group-hover:bg-white/10">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium text-gray-300 text-center">Nómina</span>
            </div>
            
            <!-- Action 3 -->
            <div class="flex flex-col items-center gap-2 group active-press">
                <div class="w-14 h-14 rounded-2xl glass-card flex items-center justify-center text-white transition-all group-active:scale-95 group-hover:bg-white/10">
                    <i data-lucide="folder-open" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium text-gray-300 text-center">Doc.</span>
            </div>
            
            <!-- Action 4 -->
            <div class="flex flex-col items-center gap-2 group active-press">
                <div class="w-14 h-14 rounded-2xl glass-card flex items-center justify-center text-white transition-all group-active:scale-95 group-hover:bg-white/10">
                    <i data-lucide="heart-pulse" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium text-gray-300 text-center">Salud</span>
            </div>

        </div>

    </main>

    <!-- Bottom Sheet for Next Events / Notifications -->
    <div class="flex-1 glass-dark rounded-t-[40px] mt-2 relative z-20 flex flex-col hide-initially animate-fade-in-up stagger-4 border-t border-white/20">
        
        <!-- Drag Handle -->
        <div class="w-full flex justify-center pt-4 pb-2">
            <div class="pull-indicator"></div>
        </div>

        <div class="px-6 py-2 flex items-center justify-between">
            <h3 class="text-sm font-medium text-white/90">Próximos Eventos</h3>
            <button class="text-[11px] text-brand-400 font-bold hover:text-brand-300">
                Ver calendario
            </button>
        </div>

        <!-- Events List -->
        <div class="flex-1 overflow-y-auto px-6 pt-4 pb-28 space-y-4">
            
            <!-- Event 1 (Upcoming Payment) -->
            <div class="glass-card p-4 rounded-2xl flex items-center gap-4 active-press cursor-pointer border-brand-500/30">
                <div class="w-10 h-10 rounded-full bg-brand-500/20 flex items-center justify-center text-brand-400 shrink-0">
                    <i data-lucide="dollar-sign" class="w-5 h-5"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-sm font-bold text-white">Pago de Quincena</h4>
                    <p class="text-[11px] text-gray-400 mt-0.5">Viernes, 15 de Septiembre</p>
                </div>
                <div class="text-right">
                    <span class="text-xs bg-white/10 px-2.5 py-1 rounded-full text-white font-medium">En 3 días</span>
                </div>
            </div>

            <!-- Event 2 (Holiday / Leave) -->
            <div class="glass-card p-4 rounded-2xl flex items-center gap-4 active-press cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 shrink-0">
                    <i data-lucide="palmtree" class="w-5 h-5"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-sm font-bold text-white">Día Feriado</h4>
                    <p class="text-[11px] text-gray-400 mt-0.5">Día de la Independencia</p>
                </div>
            </div>
            
            <!-- Event 3 (Announcement) -->
            <div class="glass-card p-4 rounded-2xl flex items-center gap-4 active-press cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-orange-500/20 flex items-center justify-center text-orange-400 shrink-0">
                    <i data-lucide="megaphone" class="w-5 h-5"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-sm font-bold text-white">Revisión de Metas (Q3)</h4>
                    <p class="text-[11px] text-gray-400 mt-0.5">Notificación de RRHH</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Floating Pill Bottom Navigation -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[85%] z-30">
        <nav class="glass-nav-pill px-6 py-4 rounded-[32px] flex items-center justify-between shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
            <a href="#" class="text-brand-400 active-press transition-colors relative flex flex-col items-center">
                <i data-lucide="home" class="w-6 h-6 fill-current"></i>
                <span class="absolute -bottom-2 w-1 h-1 bg-brand-400 rounded-full"></span>
            </a>
            
            <a href="#" class="text-gray-400 hover:text-white active-press transition-colors">
                <i data-lucide="clock" class="w-6 h-6"></i>
            </a>
            
            <!-- Central action (Nexxus AI / Ask HR) -->
            <div class="relative -top-6 active-press">
                <button class="w-14 h-14 bg-white rounded-full flex items-center justify-center text-black shadow-[0_0_20px_rgba(255,255,255,0.3)] border border-white">
                    <i data-lucide="sparkles" class="w-6 h-6"></i>
                </button>
            </div>

            <a href="#" class="text-gray-400 hover:text-white active-press transition-colors">
                <i data-lucide="wallet" class="w-6 h-6"></i>
            </a>
            
            <a href="#" class="text-gray-400 hover:text-white active-press transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
            </a>
        </nav>
    </div>

    <!-- Scripts for icons -->
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
